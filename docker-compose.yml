services:
  fastapi:
    build:
      context: .
      dockerfile: docker/fastapi.Dockerfile
    container_name: miigaik_fastapi_app
    ports:
      - "8888:8000"
    volumes:
      - .:/app
      - ./database.db:/app/database.db
    environment:
      - PYTHONUNBUFFERED=1
    restart: always

  news_migration:
    build:
      context: .
      dockerfile: docker/news.migration.Dockerfile
    container_name: miigaik_news_migration
    environment:
      - INTERVAL_MINUTES=10
    volumes:
      - ./database.db:/app/database.db
    restart: unless-stopped

  groups_migration:
    build:
      context: .
      dockerfile: docker/groups.migration.Dockerfile
    container_name: miigaik_groups_migration
    environment:
      - CRON_SCHEDULE=0 0 * * 0
    volumes:
      - ./database.db:/app/database.db
    restart: unless-stopped

  classrooms_migration:
    build:
      context: .
      dockerfile: docker/classrooms.migration.Dockerfile
    container_name: miigaik_classrooms_migration
    environment:
      - CRON_SCHEDULE=0 0 * * 0
    volumes:
      - ./database.db:/app/database.db
    restart: unless-stopped