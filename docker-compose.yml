services:
  fastapi:
    build: .
    container_name: miigaik_fastapi_app
    ports:
      - "8888:8000"
    volumes:
      - .:/app
      - ./database.db:/app/database.db
    environment:
      - PYTHONUNBUFFERED=1
    restart: always

  news_migration:
    build:
      context: .
      dockerfile: news.migration.Dockerfile
    container_name: miigaik_news_migration
    environment:
      - INTERVAL_MINUTES=10
    volumes:
      - ./database.db:/app/database.db
    restart: unless-stopped